CHECKLIST DO PROFISSIONAL

Antes de considerar a preventiva concluída, o profissional deve conseguir responder:

Infraestrutura
 Sei de onde vem a energia.
 Sei identificar o QDGE.
 Sei explicar o caminho AC.
 Sei explicar o caminho DC.
 Sei onde estão UPS e FCC.
 Sei identificar QDF/QDCC/QFAC.
Operação
 Sei o horário da atividade.
 Sei abrir/consultar o ticket.
 Sei que preciso aguardar autorização.
 Sei trabalhar seguindo o procedimento aplicável.
Medições
 Sei quais pontos AC medir.
 Sei quais pontos DC medir.
 Sei medir corrente dos circuitos.
 Sei interpretar uma anormalidade sem tirar conclusão precipitada.
Baterias
 Sei medir individualmente.
 Sei diferenciar flutuação e descarga.
 Sei utilizar o HIOKI.
 Sei que resistência interna não deve ser analisada isoladamente.
Registro
 Sei registrar as medições.
 Sei registrar anormalidades.
 Sei organizar evidências.
 Sei finalizar a atividade no Infratel.
Segurança
 Sei quais requisitos de segurança devo observar.
 Sei que autorização é obrigatória conforme o fluxo.
 Sei que procedimento do local/fabricante prevalece sobre uma "regra decorada".
TESTE DE FIXAÇÃO POR MÓDULO

Uma melhoria importante para o site seria colocar, ao final de cada módulo, um pequeno bloco:

🧠 TESTE SEUS CONHECIMENTOS

Responda às perguntas para verificar se você compreendeu este módulo.

Por exemplo, no módulo de corrente:

Pergunta: Foi encontrada corrente elevada em um disjuntor. Qual deve ser a primeira abordagem?

A) Trocar imediatamente o disjuntor.
B) Desligar o rack.
C) Identificar o circuito e a carga alimentada e investigar a condição.
D) Ignorar porque a tensão está normal.

Resposta correta: C.

Isso prepara o profissional progressivamente para o Simulado Final de 30 questões.

