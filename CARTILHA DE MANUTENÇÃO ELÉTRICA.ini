CARTILHA DE MANUTENÇÃO ELÉTRICA
HUBs, Sites e Data Centers
Objetivo da cartilha

Esta cartilha foi desenvolvida para apresentar, de forma didática e organizada, como funciona a infraestrutura elétrica de um HUB/Site/Data Center e como é executada a rotina de manutenção preventiva.

O profissional deverá compreender:

de onde vem a energia;
como ela é transferida e distribuída;
função dos principais quadros e equipamentos;
funcionamento de gerador, UPS e FCC;
arquitetura AC e DC;
bancos de baterias;
climatização;
medições elétricas;
medição de corrente dos circuitos;
identificação de anormalidades;
testes de baterias;
procedimento de descarga dos retificadores;
utilização do HIOKI BT3554-01;
registro das atividades no Infratel;
requisitos de segurança;
documentação e encerramento da atividade.

Importante: esta cartilha é material de treinamento interno. Ela não substitui NR-10, procedimentos corporativos, autorização formal para intervenção, documentação do local, projetos, manuais dos fabricantes ou demais procedimentos aplicáveis.

MÓDULO 01 — VISÃO GERAL DA INFRAESTRUTURA
1.1 O que é um HUB/Site/Data Center?

Um HUB ou Site de telecomunicações possui diversos equipamentos responsáveis por manter serviços de comunicação funcionando continuamente.

Esses equipamentos dependem de uma infraestrutura elétrica capaz de:

receber energia;
distribuir energia;
manter equipamentos funcionando durante transferências;
fornecer energia de corrente alternada — AC;
fornecer energia de corrente contínua — DC;
manter sistemas de emergência disponíveis;
manter climatização adequada;
registrar e monitorar as condições da instalação.

Por isso, a manutenção preventiva não deve ser entendida simplesmente como "medir tensão".

O objetivo é verificar as condições da infraestrutura que mantém a carga crítica funcionando.

1.2 Visão simplificada da instalação

A instalação pode ser entendida em grandes blocos:

Entrada de energia → transferência → distribuição → sistemas de continuidade → cargas

Dentro dessa arquitetura existem sistemas AC e DC.

Sistema AC

A energia passa por equipamentos de distribuição e pelos sistemas UPS antes de chegar às cargas AC.

Sistema DC

A energia fornecida pelos sistemas FCC passa pelo QDF até chegar às cargas DC.

1.3 Principais equipamentos

Durante a cartilha serão estudados:

Concessionária;
Padrão de Entrada/Cabine;
QTA/ATM;
Gerador;
QDGE;
UPS 1;
UPS 2;
QDNB;
QDT;
FCC 01;
FCC 02;
QDF;
QFAC;
PDT;
QDCC;
bancos de baterias.

Cada equipamento possui uma função específica dentro da infraestrutura.

1.4 O que o profissional precisa compreender

Antes de realizar qualquer medição, é fundamental saber:

"Onde estou medindo, de onde vem essa energia e qual carga depende desse circuito?"

Essa visão evita que uma medição seja tratada isoladamente.

MÓDULO 02 — CAMINHO DA ENERGIA
2.1 Por que conhecer o caminho da energia?

Imagine que um equipamento de telecomunicações apresente uma falha.

Para investigar corretamente, o profissional precisa saber qual é o caminho elétrico que alimenta aquele equipamento.

O conhecimento da arquitetura permite seguir a energia desde sua origem até a carga.

2.2 Caminho principal

A arquitetura estudada na cartilha é:

Concessionária
↓
Padrão de Entrada / Cabine Primária
↓
QTA / ATM
↓
QDGE
↓
Sistemas de distribuição e continuidade
↓
Cargas

O QDGE distribui energia para diversos sistemas.

2.3 Caminho AC

Um dos caminhos AC é:

UPS 1 → QDNB 1 → QDT 1 → Carga AC

Outro caminho:

UPS 2 → QDNB 2 → QDT 2 → Carga AC

Esses caminhos fazem parte da infraestrutura utilizada para manter cargas AC alimentadas.

2.4 Caminho DC

Para as cargas DC:

FCC 01/02 → QDF → Carga DC

O FCC é responsável pelo fornecimento de corrente contínua e pela manutenção do banco de baterias associado ao sistema.

2.5 Climatização

Existe ainda o caminho associado à climatização:

QFAC → evaporadoras/condensadoras → climatização do Data Center

A climatização também é parte importante da infraestrutura, pois os equipamentos críticos dependem das condições adequadas do ambiente.

MÓDULO 03 — GERADOR E TRANSFERÊNCIA
3.1 Para que serve o gerador?

O gerador funciona como uma fonte de energia de emergência.

Quando ocorre uma interrupção da alimentação da concessionária, o sistema de transferência pode comandar a entrada do gerador para manter a alimentação da instalação.

3.2 QTA e ATM

Na arquitetura estudada:

QTA: realiza a transferência automática;
ATM: permite operação manual conforme a configuração/procedimento do local.

Em uma perda da alimentação normal, o sistema identifica a condição e inicia a sequência de transferência.

3.3 Sequência simplificada

De forma didática:

Perda da concessionária

↓

Detecção da falha

↓

Partida do gerador

↓

Estabilização

↓

Transferência da alimentação

↓

Manutenção da carga

O profissional deve conhecer essa sequência para entender o comportamento da instalação durante uma falta de energia.

MÓDULO 04 — QDGE E DISTRIBUIÇÃO
4.1 O que é o QDGE?

O Quadro de Distribuição Geral de Energia — QDGE é um ponto central da distribuição elétrica da instalação.

Ele recebe energia e distribui para diferentes sistemas.

4.2 Principais derivações

Na arquitetura estudada, o QDGE possui derivações para:

QDNB/QDT Bypass;
UPS 1;
UPS 2;
QDLE;
QFAC;
FCC 01;
FCC 02;
QDNB.
4.3 Por que o QDGE é importante na preventiva?

Durante a manutenção, o profissional pode verificar:

tensões;
correntes;
frequência;
condições aparentes;
distribuição das cargas;
anormalidades;
registros históricos.

Qualquer anormalidade encontrada deve ser registrada e tratada conforme procedimento.

MÓDULO 05 — UPS
5.1 O que é uma UPS?

UPS é um sistema de alimentação ininterrupta.

Sua função é fornecer continuidade de alimentação para cargas críticas durante determinadas condições de falha ou transferência.

5.2 Por que a UPS é importante?

Uma transferência entre fontes pode representar uma condição crítica para equipamentos de telecomunicações e TI.

A UPS participa da estratégia de continuidade da alimentação.

Na arquitetura estudada:

UPS 1 → QDNB 1 → QDT 1 → Carga AC

UPS 2 → QDNB 2 → QDT 2 → Carga AC

5.3 UPS e banco de baterias

O banco de baterias permanece associado à UPS para fornecer autonomia quando necessário.

No ambiente descrito, as baterias da UPS são normalmente:

12 V;
aproximadamente 150 Ah;
40 elementos no banco.

Como referência de campo fornecida para este ambiente:

Flutuação: aproximadamente 13,7 V.

Foi também informado como referência de campo um valor aproximado de 12,5 V em descarga.

Esses valores são referências do ambiente descrito e não devem ser tratados como limites universais de aprovação. A avaliação deve considerar tipo de bateria, temperatura, fabricante, histórico e procedimento aplicável.

MÓDULO 06 — FCC E SISTEMA DC
6.1 O que é o FCC?

O FCC é o sistema responsável pelo fornecimento de corrente contínua.

Uma função fundamental é converter a alimentação AC disponível em DC para alimentar as cargas e manter o banco de baterias em condição adequada.

6.2 Caminho DC

A arquitetura estudada é:

FCC 01 → QDF → Carga DC

e

FCC 02 → QDF → Carga DC

6.3 Retificadores

O FCC possui retificadores responsáveis pela conversão da energia.

Os retificadores também participam da manutenção da tensão do sistema e da carga dos bancos de baterias.

6.4 Flutuação

Durante a operação normal, as baterias permanecem em flutuação.

A condição de flutuação mantém o banco preparado para atuar quando necessário.

MÓDULO 07 — BANCOS DE BATERIAS UPS E FCC
7.1 Por que existem baterias?

As baterias são utilizadas para fornecer autonomia durante determinadas condições de interrupção ou falha da alimentação.

Elas são parte fundamental da continuidade dos sistemas críticos.

7.2 Baterias da UPS

Referências fornecidas para o ambiente:

12 V;
aproximadamente 150 Ah;
banco com 40 elementos;
aproximadamente 13,7 V em flutuação;
aproximadamente 12,5 V em descarga como referência de campo.
7.3 Baterias FCC

Existem configurações diferentes conforme a instalação.

Foram informados exemplos como:

baterias de 12 V;
baterias seladas de 2 V / 1000 Ah;
determinadas instalações com 12 bancos e 48 baterias.

Portanto:

Nunca presumir que todos os HUBs possuem exatamente a mesma configuração de bateria.

7.4 Manutenção de baterias

Em baterias que exigem manutenção, pode existir necessidade de reposição de água.

Quando previsto pelo fabricante/procedimento:

utiliza-se água desmineralizada.

Esse procedimento não deve ser realizado simplesmente porque "a bateria parece baixa". Deve seguir a especificação do fabricante e o procedimento aplicável.

MÓDULO 08 — QFAC E CLIMATIZAÇÃO
8.1 Por que a climatização faz parte da manutenção elétrica?

O ambiente de Data Center possui equipamentos que geram calor continuamente.

A climatização mantém as condições necessárias para funcionamento dos equipamentos.

8.2 Caminho

QFAC

↓

Evaporadoras / Condensadoras

↓

Climatização do Data Center

8.3 O que observar

Durante a preventiva, devem ser verificadas as condições previstas no procedimento aplicável, incluindo as medições elétricas dos circuitos relacionados.

Uma anormalidade elétrica em um equipamento de climatização pode comprometer a capacidade de refrigeração do ambiente.

MÓDULO 09 — ROTINA DA MANUTENÇÃO PREVENTIVA
9.1 Janela de trabalho

A janela normalmente utilizada é:

21:00 às 06:45

9.2 Chegada ao local

Ao chegar:

reunir equipamentos de medição;
reunir ferramentas;
verificar EPIs/EPCs aplicáveis;
verificar condições para execução;
identificar a atividade programada.
9.3 Ticket de entrada

A atividade é registrada por meio do ticket/acionamento correspondente.

O registro deve permitir identificar informações como:

local;
data;
horário;
atividade;
equipamento;
responsáveis;
restrições;
observações.
9.4 Autorização

Após o registro, deve-se aguardar a autorização do Site Management Center, conforme fluxo informado.

A atividade não deve começar antes da autorização necessária.

9.5 Equipe

Normalmente trabalham duas pessoas:

Profissional 1: realiza medições.

Profissional 2: registra, acompanha e confere as informações.

Essa divisão ajuda a reduzir erros de registro e aumenta a rastreabilidade.

9.6 Execução

A sequência geral envolve:

Preparação → autorização → inspeção → medições → registros → análise → documentação → encerramento

9.7 Encerramento

Após concluir a atividade:

conferir registros;
verificar se todas as medições foram realizadas;
registrar anormalidades;
organizar evidências;
finalizar documentação;
realizar o encerramento no Infratel.
MÓDULO 10 — MEDIÇÕES ELÉTRICAS AC E DC
10.1 Por que medir?

A medição permite verificar o comportamento elétrico da instalação e identificar condições anormais.

Não basta apenas coletar números.

É necessário entender o que está sendo medido e por que aquela medição é importante.

10.2 Pontos AC

Foram definidos os seguintes pontos:

Padrão de Entrada;
QTA;
QDGE;
QDNB;
PDT;
QFAC.
10.3 Pontos DC
QDF;
QDCC;
bancos de baterias;
UPS/FCC conforme o ponto e procedimento aplicável.
10.4 Grandezas

Entre as grandezas avaliadas estão:

AC
fase-fase;
fase-neutro;
fase-terra, quando aplicável;
corrente;
frequência.
DC
tensão DC;
corrente DC, quando aplicável.
10.5 Como interpretar

Uma medição isolada não deve ser automaticamente classificada como "boa" ou "ruim".

É necessário considerar:

equipamento;
ponto de medição;
configuração;
histórico;
procedimento;
fabricante;
condições da instalação.
MÓDULO 11 — MEDIÇÃO DE CORRENTE DOS CIRCUITOS
11.1 Por que medir a corrente?

A tensão informa uma condição do circuito.

A corrente mostra quanto de carga está sendo solicitada naquele circuito naquele momento.

Por isso, a corrente de cada circuito/disjuntor é uma informação importante da preventiva.

11.2 Quando encontramos corrente elevada?

A sequência de investigação pode ser:

Medição elevada

↓

Identificar disjuntor/circuito

↓

Identificar rack/equipamento alimentado

↓

Verificar carga

↓

Verificar redundância

↓

Avaliar distribuição entre fases

↓

Definir ação conforme procedimento/autorização

11.3 Redundância

Antes de alterar a alimentação de um equipamento crítico, é importante verificar se existe alimentação redundante e compreender a arquitetura daquele equipamento.

Não se deve simplesmente desligar ou transferir um circuito porque sua corrente está elevada.

11.4 Balanceamento de fases

Quando tecnicamente aplicável e autorizado, pode ser avaliado o balanceamento das cargas entre fases.

O objetivo é melhorar a distribuição da carga, respeitando a arquitetura existente e os procedimentos aplicáveis.

11.5 Regra importante

Corrente elevada é um sinal para investigar — não uma ordem automática para trocar o disjuntor.

MÓDULO 12 — INSPEÇÃO E ANORMALIDADES
12.1 O que procurar?

Durante uma preventiva, o profissional deve estar atento a sinais como:

aquecimento;
corrente anormal;
tensão anormal;
comportamento diferente do histórico;
sinais de degradação;
anormalidades em quadros;
anormalidades em baterias;
alterações físicas aparentes.
12.2 A importância da evidência

Quando uma anormalidade for encontrada, o ideal é registrar:

equipamento;
circuito;
condição encontrada;
medição;
horário;
evidência;
observação;
ação realizada ou recomendada.
12.3 Histórico

Uma das grandes vantagens da manutenção preventiva é permitir comparação.

Por exemplo:

Medição anterior → medição atual → tendência

Uma alteração gradual pode ser tão importante quanto uma anormalidade imediata.

MÓDULO 13 — TESTE DE BATERIAS
13.1 Por que testar individualmente?

Um banco pode apresentar uma condição aparentemente normal enquanto uma bateria individual apresenta comportamento diferente.

Por isso, as baterias são medidas individualmente.

13.2 Medição

A avaliação pode envolver:

tensão;
corrente, quando aplicável;
condição em flutuação;
condição em descarga;
resistência interna;
teste complementar com carga/resistor, quando previsto.
13.3 Comparação

O profissional deve comparar os elementos.

Por exemplo:

Bateria A → comportamento normal

Bateria B → comportamento diferente

Isso indica necessidade de investigação.

13.4 Resistência interna

A resistência interna é uma informação importante para avaliar a condição da bateria.

Entretanto:

Uma única leitura de resistência não deve ser utilizada isoladamente para declarar uma bateria como aprovada ou reprovada.

A análise deve considerar também:

tensão;
comportamento em descarga;
temperatura;
histórico;
condição física;
especificação do fabricante.
MÓDULO 14 — PROCEDIMENTO FCC — DESCARGA DOS RETIFICADORES

Este módulo deve ser tratado como procedimento operacional específico do ambiente informado, e não como procedimento universal para qualquer FCC.

14.1 Objetivo

Realizar a condição de descarga conforme o procedimento utilizado no ambiente, permitindo avaliar o comportamento do sistema/banco durante o período estabelecido.

14.2 Sequência fornecida
Entrada no modo de manutenção

1. Acessar:

Ajustes de Parâmetros → ACU

2. Selecionar:

Modo Manual

3. Ajustar:

Bat. em Descarga = 47.0

Ajuste do Grupo Ret

4. Acessar:

Menu Principal → Manutenção → Grupo Ret

5. Ajustar a tensão para:

48.00 V

6. Manter nessa condição por aproximadamente:

10 minutos

O tempo pode variar conforme a carga do HUB.

Retorno do sistema

7. Retornar a tensão para:

54.00 V

8. Acessar:

Ajustes de Parâmetros → ACU

9. Ajustar:

Bat. em Descarga = 49.2

10. Retornar o modo para:

Automático

11. Verificar se a tensão retorna aproximadamente para:

54.00 V

14.3 Ponto de atenção

Se o sistema não retornar ao comportamento esperado, os ajustes realizados devem ser conferidos conforme o procedimento.

O profissional não deve improvisar alterações de parâmetros.

MÓDULO 15 — HIOKI BT3554-01
15.1 Para que serve?

O HIOKI BT3554-01 é utilizado na avaliação de baterias, permitindo obter informações como:

tensão;
resistência interna;
condição da bateria;
registros das medições.
15.2 Instalação do driver

No ambiente informado:

C:\Program Files (x86)\HIOKI\GENNECT One\driver

Existem instaladores para:

DPInst64.exe — sistemas 64 bits;
DPInst32.exe — sistemas 32 bits.

A instalação deve ser executada com privilégios administrativos.

15.3 Conexão

Após instalar:

conectar o equipamento por USB;
verificar o reconhecimento;
confirmar o indicador/ícone de conexão com o PC.
15.4 Zero Adjustment

Antes das medições:

conectar as pontas conforme orientação;
encostar o pino central de uma ponta na parte externa da outra;
executar 0-ADJ;
verificar indicação próxima de zero.
15.5 A.MEM

Quando o A.MEM está ativo, a leitura pode ser armazenada automaticamente quando estabiliza.

Caso não esteja ativo, a memória pode ser acionada manualmente após o aviso sonoro.

15.6 Medição

As baterias devem ser avaliadas individualmente.

Após posicionar as pontas:

aguardar estabilização → aguardar sinal sonoro → registrar a leitura

15.7 GENNECT One

Fluxo informado:

Instrument Connection

↓

Search

↓

BT3554-01 Connected

↓

File Acquisition

↓

selecionar dados

↓

Import

↓

Data List

↓

Export PDF Report / CSV

15.8 Problemas comuns

Se o equipamento não aparecer:

verificar cabo USB;
testar outra porta USB;
verificar instalação do driver.

Se os dados não aparecerem:

verificar o contador de memória;
confirmar que não está em 000.
MÓDULO 16 — INFRATEL E REGISTRO
16.1 Por que registrar?

Uma manutenção sem registro perde grande parte de sua rastreabilidade.

O registro permite saber:

o que foi feito;
quando foi feito;
onde foi feito;
quem participou;
quais medições foram encontradas;
quais anormalidades foram identificadas;
quais evidências foram produzidas.
16.2 Fluxo

Ticket

↓

Autorização

↓

Execução

↓

Medições

↓

Registros

↓

Documentação

↓

Relatório

↓

Encerramento no Infratel

16.3 Qualidade do registro

Evite registros genéricos como:

"Preventiva realizada."

Um bom registro deve permitir que outra pessoa compreenda o que aconteceu.

Exemplo de estrutura:

Equipamento: QDGE
Ponto: Circuito X
Medição: valor encontrado
Condição: normal/anormal conforme procedimento
Observação: descrição objetiva
Evidência: registro correspondente
Ação: realizada ou encaminhada

MÓDULO 17 — SEGURANÇA, NR-10 E PROCEDIMENTOS
17.1 Segurança vem antes da medição

Nenhuma medição justifica ignorar uma condição de risco.

Antes de iniciar:

verificar autorização;
verificar procedimento;
utilizar EPI/EPC aplicáveis;
avaliar riscos;
conhecer o equipamento;
respeitar as condições operacionais.
17.2 NR-10

As atividades envolvendo instalações e serviços em eletricidade devem observar os requisitos aplicáveis da NR-10, além dos procedimentos corporativos e demais normas/documentações pertinentes.

17.3 Não improvisar

O profissional não deve:

alterar parâmetros sem autorização;
modificar circuitos sem compreender a arquitetura;
desligar cargas críticas sem procedimento;
ignorar alarmes;
substituir componentes apenas por suspeita;
utilizar valores de referência como se fossem limites universais.
